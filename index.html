<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Refreshing…</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 48px 24px;
         text-align: center; color: #111827; }
  h2 { margin-bottom: 8px; }
  p { color: #475569; max-width: 560px; margin: 8px auto; }
  .ok { color: #16a34a; } .bad { color: #dc2626; }
</style>
</head>
<body>
<h2 id="h">Starting the refresh…</h2>
<p id="p">This tab closes by itself when it has started.</p>
<script>
/* Opened from a link that carries, after the #, the address to call and its key.
   Nothing after a # is ever sent to this host. The page calls that address once,
   closes the tab if the call succeeded, and otherwise stays open and says why. */
(function () {
  var h = document.getElementById('h'), p = document.getElementById('p');
  function fail(msg) {
    document.title = 'Refresh failed';
    h.textContent = '⚠️ The refresh did not start';
    h.className = 'bad';
    p.textContent = msg;
  }

  var args = new URLSearchParams(location.hash.slice(1));
  var u = args.get('u') || '', k = args.get('k') || '';
  // Take the key out of the address bar and the tab's history straight away.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u) || !k) {
    fail('This link is incomplete. Use the Refresh button in the latest email.');
    return;
  }

  var slow = setTimeout(function () { p.textContent = 'Still working — this can take up to a minute.'; }, 6000);
  var url = u + '?action=regenerate&format=json&k=' + encodeURIComponent(k);

  fetch(url, { redirect: 'follow', credentials: 'omit', cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('The server answered ' + r.status + '.');
      return r.text();
    })
    .then(function (text) {
      var d;
      try { d = JSON.parse(text); } catch (e) { throw new Error('The server sent a reply this page could not read.'); }
      if (!d.ok) throw new Error(d.message || 'The server refused the request.');
      clearTimeout(slow);
      document.title = 'Refresh started';
      h.textContent = '✓ Refresh started';
      h.className = 'ok';
      p.textContent = d.message || '';
      setTimeout(function () {
        window.close();
        // Still here a moment later means the browser refused to close the tab.
        setTimeout(function () { p.textContent = (d.message || '') + ' You can close this tab.'; }, 1200);
      }, 900);
    })
    .catch(function (err) {
      clearTimeout(slow);
      fail((err && err.message) || String(err));
    });
})();
</script>
</body>
</html>
